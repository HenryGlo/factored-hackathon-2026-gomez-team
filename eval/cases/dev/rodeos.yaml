# Clientes que dan rodeos (prompt 07, bloque 3, parte G): casos multiturno es/pt. Mismo esquema que cases.yaml.
# Cada patrón: historia larga, referencia indirecta, corrección a mitad del flujo, cambio de movimiento, cancelar y retomar,
# queja mezclada con el pedido, pregunta respondida con otra pregunta y mensajes muy cortos.

# ------------------------------------------------------------ 1. historia larga antes del pedido real
- case_id: dev-rodeo-historia-larga-es
  split: dev
  language: es
  category: ambiguo
  title: Historia larga antes del pedido real
  selector: cargo_claro
  pick: 23
  steps:
    - message: "Buenas, mire, le cuento. El fin de semana estuve de viaje con mi familia, fuimos a visitar a mi suegra que estaba enferma, y la verdad casi no usé la tarjeta porque todo lo pagó mi cuñado. Cuando volví me puse a revisar la app, que por cierto me costó entrar porque se me había olvidado la clave, y entre varias cosas vi un cargo de {monto_es} {moneda_es} en {comercio}. Ese no lo reconozco, yo ahí no compré nada."
    - message: "sí, ese es"
      when: [confirmando_movimiento]
    - action: confirm
      when: [confirmando_accion]
  expected:
    outcome: resolved_case
    transaction: target
    reason_code: unrecognized

- case_id: dev-rodeo-historia-larga-pt
  split: dev
  language: pt
  category: ambiguo
  title: História longa antes do pedido real
  selector: cargo_claro
  pick: 24
  steps:
    - message: "Oi, tudo bem? Deixa eu te explicar. Semana passada eu estava viajando a trabalho, fiquei três dias fora, e quase não usei o cartão porque a empresa pagou tudo. Quando voltei fui olhar o aplicativo com calma, porque minha esposa tinha comentado de uns gastos, e no meio de tudo apareceu uma cobrança de {monto_pt} {moneda_pt} no {comercio_pt}. Essa eu não reconheço, não comprei nada lá."
    - message: "sim, é essa"
      when: [confirmando_movimiento]
    - action: confirm
      when: [confirmando_accion]
  expected:
    outcome: resolved_case
    transaction: target
    reason_code: unrecognized

