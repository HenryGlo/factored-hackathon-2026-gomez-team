# Ciclo de mejora con Opus (prompt 08, A6): SOLO manual. Analiza los fallos del harness (dataset sintético, LLM falso) y abre
# un PR en BORRADOR con el reporte y los casos propuestos. Nunca fusiona: una persona revisa. El feedback de clientes (👎) vive
# en la base de la aplicación y se analiza en local con `scripts/improve_loop.py run --database-url ...` (docs/improvement-loop.md).
# Necesita el secreto ANTHROPIC_API_KEY (environment eval-llm).
name: Improve loop (manual)

on:
  workflow_dispatch:

permissions:
  contents: write          # crear la rama improve/<fecha>
  pull-requests: write     # abrir el PR en borrador (nunca fusionarlo)

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: eval-llm
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: bank
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d bank" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      EVAL_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/bank_eval_ci_test
      EVAL_DATASET: synthetic
      APP_DB_USER: bank_app
      APP_DB_PASSWORD: ci-app-password
      CONSOLE_DB_USER: bank_console
      CONSOLE_DB_PASSWORD: ci-console-password
      LOG_LEVEL: WARNING
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Roles y base de prueba
        env:
          POSTGRES_USER: ci
          POSTGRES_DB: bank
          PGHOST: localhost
          PGPASSWORD: ci
        run: |
          bash infra/postgres/init/01-roles.sh
          psql -U ci -d bank -c "CREATE DATABASE bank_eval_ci_test"
      - name: Harness dev (LLM falso) para reunir fallos
        run: |
          python -m eval.run --split dev --variant baseline --repeats 1
          python -m eval.run --split dev --variant sistema --repeats 1 --set LLM_PROVIDER=fake
      - name: Análisis con Opus y PR en borrador
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "improve-loop"
          git config user.email "improve-loop@users.noreply.github.com"
          python scripts/improve_loop.py run --llm anthropic_api --raw eval/results/raw/*_dev.json
