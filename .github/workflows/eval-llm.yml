# Evaluación con la API real de Claude: SOLO manual (workflow_dispatch), nunca en PRs (costo y secretos).
# Necesita el secreto ANTHROPIC_API_KEY del repositorio. Corre el split dev con la variante sistema_api sobre el dataset
# sintético (el dataset real no sale de la máquina del equipo) y sube el reporte.
name: Eval LLM (manual)

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: Repeticiones
        default: "1"
        required: true

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: eval-llm
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: bank
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d bank" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      EVAL_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/bank_eval_ci_test
      EVAL_DATASET: synthetic
      APP_DB_USER: bank_app
      APP_DB_PASSWORD: ci-app-password
      CONSOLE_DB_USER: bank_console
      CONSOLE_DB_PASSWORD: ci-console-password
      LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Roles y base
        env: {POSTGRES_USER: ci, POSTGRES_DB: bank, PGHOST: localhost, PGPASSWORD: ci}
        run: |
          bash infra/postgres/init/01-roles.sh
          psql -U ci -d bank -c "CREATE DATABASE bank_eval_ci_test"
      - name: Harness dev · sistema_api (API real)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m eval.run --split dev --variant sistema_api --repeats "${{ inputs.repeats }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-llm-dev
          path: |
            eval/results/*_dev.md
            eval/results/raw/*_dev.json
          if-no-files-found: ignore
          retention-days: 30
