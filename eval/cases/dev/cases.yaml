# Casos del split dev. Escritos por el equipo; los clientes y transacciones reales los elige cada selector
# (eval/cases/selectors.py) al correr. Marcadores: {monto_es}, {monto_pt}, {monto_aprox}, {moneda_es}, {moneda_pt},
# {comercio}, {comercio_pt}, {fecha_ddmm}, {fecha_es}, {fecha_pt}, {fecha_mal_ddmm}, {mes_es}, {mes_pt},
# {categoria_es}, {categoria_pt}, y los mismos con prefijo second_ para la segunda transacción.
# Esquema: eval/cases/schema.py.

# ============================================================ normal
- case_id: dev-claro-es
  split: dev
  language: es
  category: normal
  title: Cargo claro con monto y comercio
  selector: cargo_claro
  pick: 0
  steps:
    - message: "Hola, no reconozco un cargo de {monto_es} {moneda_es} en {comercio}"
    - message: "sí, es ese"
    - action: confirm
  expected:
    outcome: resolved_case
    transaction: target
    reason_code: unrecognized
    clarify_rounds: 0
    required_tools: [search_transactions, get_transaction, get_existing_case, create_dispute_case, get_case]

