# Casos en inglés (2026-10-05): espejo de casos de dev en español, mismos selectores y resultado esperado.
- case_id: dev-claro-en
  split: dev
  language: en
  category: normal
  title: Clear charge, disputed end to end
  selector: cargo_claro
  steps:
  - message: Hi, I don't recognize a charge of {monto_en} {moneda_en} at {comercio_en}
  - message: yes, that's the one
  - action: confirm
  expected:
    outcome: resolved_case
    transaction: target
    required_tools:
    - search_transactions
    - get_transaction
    - get_existing_case
    - create_dispute_case
    - get_case
    clarify_rounds: 0
    reason_code: unrecognized
