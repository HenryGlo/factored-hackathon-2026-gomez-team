# CI en cada PR y en cada push a main (prompt 05, fase 4). Nada de datos del dataset, secretos ni .env:
# las pruebas usan los fixtures FXT- y el harness, el dataset sintético de eval/synthetic/ (con LLM_PROVIDER=fake).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:          # release.yml la reutiliza antes de publicar un Release

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # todo el historial: el repo será público
      - name: gitleaks (historial completo, valores ocultos)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1

  backend:
    name: Backend, pipeline y harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: bank
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d bank" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # credenciales de una base efímera del runner: no son secretos
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/bank_test
      EVAL_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/bank_eval_ci_test
      EVAL_DATASET: synthetic
      APP_DB_USER: bank_app
      APP_DB_PASSWORD: ci-app-password
      CONSOLE_DB_USER: bank_console
      CONSOLE_DB_PASSWORD: ci-console-password
      LLM_PROVIDER: fake
      LOG_LEVEL: WARNING
      TZ: UTC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Dependencias
        run: pip install -r requirements-dev.txt

      - name: Roles y bases de prueba (como infra/postgres/init)
        env:
          POSTGRES_USER: ci
          POSTGRES_DB: bank
          PGHOST: localhost
          PGPASSWORD: ci
        run: |
          bash infra/postgres/init/01-roles.sh
          for db in bank_test bank_perf_test bank_eval_ci_test; do psql -U ci -d bank -c "CREATE DATABASE $db"; done

      - name: Lint (ruff)
        run: ruff check backend eval scripts data_pipeline

      - name: Tipos (mypy)
        run: mypy backend/app

      - name: Tests del backend, del pipeline y del harness
        run: python -m pytest -q backend data_pipeline eval/tests

      - name: Harness dev · baseline (dataset sintético)
        run: python -m eval.run --split dev --variant baseline --repeats 1

      - name: Harness dev · sistema con LLM_PROVIDER=fake
        run: python -m eval.run --split dev --variant sistema --repeats 1 --set LLM_PROVIDER=fake

      - name: Puerta de calidad (0 inseguros, sin regresión frente a main)
        run: python -m eval.ci_gate --split dev baseline "sistema+llm_provider-fake"

      - name: Reporte del harness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-dev-synthetic
          path: |
            eval/results/*_dev.md
            eval/results/raw/*_dev.json
          if-no-files-found: ignore
          retention-days: 14

  image:
    name: Imagen del backend (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # la misma imagen que despliega Render (render.yaml): si no construye, no se despliega
      - name: docker build
        run: docker build -f infra/render/backend.Dockerfile -t disputas-backend:ci .
      - name: La imagen no lleva datos, secretos ni el frontend
        run: |
          docker run --rm disputas-backend:ci sh -c '! ls -d .env data dataset frontend eval 2>/dev/null | grep . && id -un | grep -qx app'

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # el job se activa solo cuando existe frontend/package.json (antes de fusionar el frontend, termina en verde sin hacer nada)
      - name: ¿Hay frontend?
        id: has
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "sin frontend/package.json; nada que hacer"
          fi

      - uses: actions/setup-node@v4
        if: steps.has.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar
        if: steps.has.outputs.present == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint (eslint) y tipos (tsc)
        if: steps.has.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint && npm run typecheck

      - name: Tests (vitest)
        if: steps.has.outputs.present == 'true'
        working-directory: frontend
        run: npm test

      - name: Build
        if: steps.has.outputs.present == 'true'
        working-directory: frontend
        run: npm run build
