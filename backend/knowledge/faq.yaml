# Base de respuestas aprobadas sobre el proceso de reclamos y bloqueos (información confiable para el cliente).
#
# ⚠ SUPUESTOS DEL EQUIPO (P-14, P-32): no son políticas oficiales del banco ni del reto. Se muestran como información
# general del proceso de esta demo.
#
# - Recuperación por `tema` (lista cerrada que elige el LLM de intención) con fallback por `palabras` (backend/app/knowledge.py).
#   Con 12 entradas no hace falta una base vectorial.
# - El texto aprobado se muestra TAL CUAL (el código lo copia; el LLM solo agrega una frase de contexto con los hechos del caso).
# - Ningún texto promete devoluciones ni usa palabras que la guarda R5 bloquea (lo verifica un test).
# - Al editar: subir `version`, mantener es, pt y en equivalentes y correr los tests.
version: faq@v3
supuesto_del_equipo: true
entries:
  - id: devolucion
    tema: devolucion
    palabras:
      es: [devolver, devolveran, devolucion, me regresan, recuperar el dinero, mi dinero, reintegro]
      pt: [devolver, devolvem, devolucao, estorno, receber de volta, meu dinheiro, recuperar o dinheiro]
      en: ["give back", "get my money", "my money", "money back", "refund", "recover the money"]
    texto:
      es: "Registrar un reclamo no es una devolución ni la garantiza. El banco revisa cada caso y, si concluye que el cargo no fue tuyo, el monto vuelve a tu cuenta. Te avisamos el resultado por los canales del banco."
      pt: "Registrar uma reclamação não é uma devolução nem a garante. O banco analisa cada caso e, se concluir que a cobrança não foi sua, o valor volta para a sua conta. Avisamos o resultado pelos canais do banco."
      en: "Filing a claim is not a refund and does not guarantee one. The bank reviews each case and, if it concludes the charge was not yours, the amount goes back to your account. We let you know the result through the bank's channels."

  - id: plazos
    tema: plazos
    palabras:
      es: [cuanto tarda, cuanto demora, cuanto tiempo, en cuantos dias, cuando me responden, plazo]
      pt: [quanto tempo, quanto demora, demora quanto, em quantos dias, quando respondem, prazo]
      en: ["how long", "how much time", "how many days", "when will you answer", "deadline"]
    texto:
      es: "La revisión de un reclamo suele tomar hasta 15 días hábiles. Si el banco necesita más información, te contacta antes. El plazo puede variar según el caso."
      pt: "A análise de uma reclamação costuma levar até 15 dias úteis. Se o banco precisar de mais informações, entra em contato antes. O prazo pode variar conforme o caso."
      en: "Reviewing a claim usually takes up to 15 business days. If the bank needs more information, it contacts you first. The time may vary depending on the case."

  - id: que_sigue
    tema: que_sigue
    palabras:
      es: [ahora que pasa, que sigue, y ahora, proximo paso, que pasa despues, que tengo que hacer]
      pt: [e agora, o que acontece agora, proximo passo, proximos passos, o que acontece depois, o que eu faco]
      en: ["what now", "what happens next", "what's next", "next step", "what do i do"]
    texto:
      es: "Después de registrar un reclamo no tienes que hacer nada más por ahora. El banco revisa el cargo, puede pedirte información adicional y te informa el resultado. Guarda el número de reclamo para consultarlo."
      pt: "Depois de registrar uma reclamação, você não precisa fazer mais nada por enquanto. O banco analisa a cobrança, pode pedir informações adicionais e informa o resultado. Guarde o número da reclamação para consultá-la."
      en: "After filing a claim you don't need to do anything else for now. The bank reviews the charge, may ask you for more information and tells you the result. Keep the claim number to check on it."

  - id: cancelar_reclamo
    tema: cancelar_reclamo
    palabras:
      es: [cancelar el reclamo, cancelar mi reclamo, anular el reclamo, retirar el reclamo, ya no quiero el reclamo]
      pt: [cancelar a reclamacao, cancelar minha reclamacao, anular a reclamacao, retirar a reclamacao, desistir da reclamacao]
      en: ["cancel the claim", "cancel my claim", "withdraw the claim", "i don't want the claim"]
    texto:
      es: "Por este canal no se puede cancelar un reclamo ya registrado. Si te acordaste de que el cargo sí era tuyo, pide hablar con una persona y ella anula el reclamo."
      pt: "Por este canal não é possível cancelar uma reclamação já registrada. Se você lembrou que a cobrança era sua, peça para falar com uma pessoa e ela anula a reclamação."
      en: "A claim that is already filed can't be cancelled through this channel. If you remembered the charge was yours after all, ask to talk to a person and they will cancel the claim."

  - id: cargo_pendiente
    tema: cargo_pendiente
    palabras:
      es: [cargo pendiente, cobro pendiente, sigue pendiente, esta pendiente, cuando se confirma]
      pt: [cobranca pendente, ainda pendente, esta pendente, quando confirma]
      en: ["pending charge", "still pending", "is pending", "when is it posted"]
    texto:
      es: "Un cargo pendiente todavía no está confirmado y puede cambiar o desaparecer. El reclamo formal se puede abrir cuando el cargo se confirma. Si no lo hiciste, avísanos y el equipo de fraude lo revisa mientras tanto."
      pt: "Uma cobrança pendente ainda não está confirmada e pode mudar ou desaparecer. A reclamação formal pode ser aberta quando a cobrança é confirmada. Se você não a fez, avise e a equipe de fraude analisa enquanto isso."
      en: "A pending charge is not posted yet and may change or disappear. The formal claim can be filed once the charge is posted. If you didn't make it, let us know and the fraud team reviews it in the meantime."

  - id: tarjeta_bloqueada
    tema: tarjeta_bloqueada
    palabras:
      es: [tarjeta bloqueada, desbloque, puedo usar mi tarjeta, sigue bloqueada, que pasa con mi tarjeta]
      pt: [cartao bloqueado, desbloque, posso usar meu cartao, continua bloqueado, o que acontece com meu cartao]
      en: ["blocked card", "unblock", "can i use my card", "still blocked", "what happens to my card"]
    texto:
      es: "Mientras la tarjeta esté bloqueada no se puede usar para compras ni retiros. El bloqueo no se revierte por este canal: si necesitas desbloquearla o tienes cobros automáticos asociados, habla con una persona."
      pt: "Enquanto o cartão estiver bloqueado, ele não pode ser usado para compras nem saques. O bloqueio não é revertido por este canal: se você precisar desbloqueá-lo ou tiver cobranças automáticas associadas, fale com uma pessoa."
      en: "While the card is blocked it can't be used for purchases or withdrawals. The block is not undone through this channel: if you need to unblock it or have automatic payments linked to it, talk to a person."

  - id: reposicion_tarjeta
    tema: reposicion_tarjeta
    palabras:
      es: [nueva tarjeta, reposicion, otra tarjeta, reemplazo de tarjeta, cuando llega la tarjeta]
      pt: [cartao novo, novo cartao, segunda via, reposicao, quando chega o cartao]
      en: ["new card", "replacement", "another card", "card replacement", "when will the card arrive"]
    texto:
      es: "Después de un bloqueo, la reposición de la tarjeta la gestiona una persona del banco. Si la pediste en esta conversación, ya está en curso y te contactarán para coordinar la entrega."
      pt: "Depois de um bloqueio, a reposição do cartão é feita por uma pessoa do banco. Se você pediu nesta conversa, ela já está em andamento e vão entrar em contato para combinar a entrega."
      en: "After a block, a person at the bank handles the card replacement. If you asked for it in this conversation, it's already in progress and they will contact you to arrange the delivery."

  - id: consultar_estado
    tema: consultar_estado
    palabras:
      es: [como consulto, donde veo, como reviso, como sigo mi reclamo, donde consulto]
      pt: [como consulto, onde vejo, como acompanho, onde consulto, como vejo minha reclamacao]
      en: ["how do i check", "where do i see", "how do i follow", "where can i check"]
    texto:
      es: "Puedes ver tus reclamos y su estado en la sección «Mis reclamos» o preguntándome «¿cómo va mi reclamo?». Cada reclamo tiene un número de referencia."
      pt: "Você pode ver suas reclamações e o status delas na seção «Minhas reclamações» ou me perguntando «como está minha reclamação?». Cada reclamação tem um número de referência."
      en: "You can see your claims and their status in the «My claims» section or by asking me «how is my claim going?». Each claim has a reference number."

  - id: hablar_persona
    tema: hablar_persona
    palabras:
      es: [hablar con alguien, como hablo con, contactar al banco, atencion humana, llamar al banco]
      pt: [falar com alguem, como falo com, contatar o banco, atendimento humano, ligar para o banco]
      en: ["talk to someone", "how do i talk to", "contact the bank", "human support", "call the bank"]
    texto:
      es: "Puedes pedir hablar con una persona en cualquier momento, por ejemplo con el botón «Hablar con una persona». Le pasamos tu caso con lo que ya conversamos, para que no tengas que repetirlo."
      pt: "Você pode pedir para falar com uma pessoa a qualquer momento, por exemplo com o botão «Falar com uma pessoa». Passamos o seu caso com o que já conversamos, para você não precisar repetir."
      en: "You can ask to talk to a person at any time, for example with the «Talk to a person» button. We pass your case along with what we already discussed, so you don't have to repeat it."

  - id: atencion_persona
    tema: atencion_persona
    palabras:
      es: [me pasaron con una persona, cuando me contactan, me van a llamar, el equipo de fraude, que hace el equipo]
      pt: [me passaram para uma pessoa, quando entram em contato, vao me ligar, a equipe de fraude, o que a equipe faz]
      en: ["passed me to a person", "when will they contact", "will they call me", "the fraud team", "what does the team do"]
    texto:
      es: "Cuando tu caso pasa a una persona, el equipo lo revisa con la información de esta conversación y te contacta por los canales del banco. No necesitas volver a escribir el caso."
      pt: "Quando o seu caso passa para uma pessoa, a equipe analisa com as informações desta conversa e entra em contato pelos canais do banco. Você não precisa escrever o caso de novo."
      en: "When your case goes to a person, the team reviews it with the information from this conversation and contacts you through the bank's channels. You don't need to write the case again."

  - id: seguridad
    tema: seguridad
    palabras:
      es: [me pidieron mi clave, contrasena, codigo de seguridad, me llamaron del banco, es seguro]
      pt: [pediram minha senha, senha, codigo de seguranca, me ligaram do banco, e seguro]
      en: ["asked for my password", "password", "security code", "the bank called me", "is it safe"]
    texto:
      es: "El banco nunca te pide contraseñas, claves ni códigos de seguridad por chat, llamada o correo. Si alguien te los pidió, no los compartas y bloquea tu tarjeta si crees que pueden haberla usado."
      pt: "O banco nunca pede senhas nem códigos de segurança por chat, ligação ou e-mail. Se alguém pediu, não compartilhe e bloqueie seu cartão se achar que podem tê-lo usado."
      en: "The bank never asks for passwords, PINs or security codes by chat, call or email. If someone asked you for them, don't share them and block your card if you think it may have been used."

  - id: cargo_revertido
    tema: cargo_revertido
    palabras:
      es: [revertido, que significa revertido, cargo rechazado, cargo cancelado, no se cobro]
      pt: [estornado, revertido, o que significa estornado, cobranca recusada, nao foi cobrado]
      en: ["reversed", "what does reversed mean", "declined charge", "cancelled charge", "wasn't charged"]
    texto:
      es: "Un cargo revertido o rechazado no quedó cobrado en tu cuenta, así que no hace falta abrir un reclamo por él. Si ves que se volvió a cobrar, avísanos."
      pt: "Uma cobrança estornada ou recusada não ficou cobrada na sua conta, então não é preciso abrir uma reclamação por ela. Se ela for cobrada de novo, avise."
      en: "A reversed or declined charge was not taken from your account, so there's no need to file a claim for it. If you see it charged again, let us know."

  # Redirección de consultas que no son de este chat (intención fuera_de_alcance). No se recupera por tema ni por palabras
  # clave: la usa el controlador directamente. El enlace a la página inicial (ficticia) sale de BANK_HOME_URL.
  - id: fuera_de_alcance
    tema: fuera_de_alcance
    palabras: {es: [], pt: [], en: []}
    texto:
      es: "Este chat atiende movimientos de tu cuenta, reclamos por cargos y bloqueo de tarjeta. Para otras consultas (préstamos, inversiones, apertura de cuentas, etc.), ve a la página inicial del banco y elige el chat correspondiente."
      pt: "Este chat atende lançamentos da sua conta, reclamações de cobranças e bloqueio de cartão. Para outras consultas (empréstimos, investimentos, abertura de contas etc.), acesse a página inicial do banco e escolha o chat correspondente."
      en: "This chat handles your account's transactions, claims about charges and card blocking. For other requests (loans, investments, opening accounts, etc.), go to the bank's home page and choose the right chat."
