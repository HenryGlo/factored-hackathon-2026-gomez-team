# Componentes de ML (fase 3: baselines, sin entrenar nada). Override por entorno:
#   INTENT_CLASSIFIER=keyword|llm|cascade   RANKER=rule   RISK_MODEL=raw_fraud_score|calibrated
#   RISK_THRESHOLD, CLARIFY_TAU, CLARIFY_DELTA, AMOUNT_TOLERANCE, RANKER_TEMPERATURE
# Los umbrales son supuestos iniciales; se fijan con el split dev del harness (P-09, P-25).

[components]
intent_classifier = "keyword"
ranker = "rule"
risk_model = "calibrated"

[intent_cascade]
model = "intent-v1"       # models/intent/<model>.joblib + .json; el umbral tau sale de sus metadatos (INTENT_CASCADE_TAU lo cambia)

[risk]
threshold = 0.70          # fraud_score/100 >= umbral → banda alta (R6 escala)
medium_threshold = 0.35   # >= → banda media (informativa)
calibrated_model = "risk-v1"   # RISK_MODEL=calibrated: models/risk/<modelo>.json (isotónica + umbrales por costo esperado)

[ranker]
temperature = 0.3         # softmax por lista (valor del RuleRanker en ml/ranker/03_baselines.ipynb)
recency_days = 30

[clarify]
tau = 0.60                # probabilidad mínima de la primera candidata para no preguntar
delta = 0.20              # margen mínimo sobre la segunda
amount_tolerance = 0.10   # ±10 %: candidatas "empatadas" en monto
